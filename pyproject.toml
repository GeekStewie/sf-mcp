[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sf-mcp"
dynamic = ["version"]
description = "Model Context Protocol server for Salesforce, built on salesforce-py and FastMCP"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Stewart Anderson", email = "stewart.anderson@live.co.uk" }]
requires-python = ">=3.12"
keywords = ["salesforce", "mcp", "model-context-protocol", "fastmcp", "claude", "codex", "cursor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=2.0",
    "salesforce-py[rest,connect,data360,models,bulk]>=1.0",
]

[project.urls]
Homepage = "https://github.com/geekstewie/sf-mcp"
Repository = "https://github.com/geekstewie/sf-mcp"
Issues = "https://github.com/geekstewie/sf-mcp/issues"

[project.scripts]
sf-mcp = "sf_mcp.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.4",
    "ty>=0.0.1",
]

# Local development: resolve salesforce-py from the sibling repo.
# `uv build` and PyPI consumers ignore this — they get the version-pinned
# wheel from PyPI declared in `[project].dependencies`.
[tool.uv.sources]
salesforce-py = { path = "../salesforce-py", editable = true }

[tool.hatch.version]
path = "src/sf_mcp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sf_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/**/*.py",
    "tests/**/*.py",
    "examples/**/*.json",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
extend-exclude = ["tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E722", "E402"]
